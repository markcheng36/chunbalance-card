<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>教練後台｜鈞衡舍 ChunBalance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 配色同 book-preview.html */
  :root{
    --charcoal:#4A4441;
    --olive:#7E9150;
    --olive-dark:#5E6E3A;
    --coral:#D4554B;
    --coral-soft:rgba(212,85,75,0.1);
    --bg:#F7F3EC;
    --line:#DCD2C1;
    --ink:#2E2A27;
    --ink-soft:#6E665D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.6;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 60px;}
  .demo{background:var(--charcoal);color:#fff;text-align:center;font-size:13px;padding:6px 12px;}
  .top{display:flex;align-items:center;gap:10px;padding:16px 0 4px;}
  .top img{height:34px;}
  .top b{font-size:16px;color:var(--charcoal);}
  .top span{margin-left:auto;font-size:13px;color:var(--ink-soft);}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px;}
  .tabs button{font:inherit;font-size:14px;font-weight:700;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;position:relative;}
  .tabs button.on{border-color:var(--coral);color:var(--coral);background:var(--coral-soft);}
  .tabs .n{position:absolute;top:-7px;right:-4px;background:var(--coral);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;}

  .box{background:#fff;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 8px 24px rgba(60,50,30,0.07);}
  .box h2{font-size:16px;font-weight:900;color:var(--charcoal);}
  .hint{font-size:13px;color:var(--ink-soft);}

  /* 日曆 */
  .days{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;}
  .days button{flex:0 0 auto;font:inherit;font-size:12.5px;width:60px;padding:7px 0;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.3;}
  .days button b{display:block;font-size:16px;}
  .days button i{display:block;font-style:normal;font-size:11px;color:var(--olive-dark);}
  .days button.off i{color:#bbb;}
  .days button.on{border-color:var(--olive);background:var(--olive);color:#fff;}
  .days button.on i{color:#fff;}
  .dayhead{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .dayhead b{font-size:15px;}
  .sw{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
  .sw input{display:none;}
  .sw span{width:40px;height:24px;border-radius:999px;background:#ccc;position:relative;transition:.2s;}
  .sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
  .sw input:checked+span{background:var(--olive);}
  .sw input:checked+span::after{left:19px;}
  .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;}
  .slot{font:inherit;font-size:14px;padding:9px 0;border-radius:10px;border:1px solid var(--olive);background:#fff;color:var(--olive-dark);cursor:pointer;line-height:1.3;}
  .slot small{display:block;font-size:11px;}
  .slot.closed{border-color:var(--line);color:#bbb;text-decoration:line-through;}
  .slot.study{border-style:dashed;border-color:var(--olive-dark);background:#EEF1E6;color:var(--olive-dark);}
  .slot.studyFull{border-style:dashed;border-color:var(--ink-soft);background:#EFEAE2;color:var(--ink-soft);}
  .act{margin-top:10px;background:var(--bg);border-radius:12px;padding:10px;}
  .act p{font-size:13px;font-weight:700;margin-bottom:8px;}
  .act .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .act button{font:inherit;font-size:13px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .act button.on{border-color:var(--charcoal);background:var(--charcoal);color:#fff;}
  .slot.booked{border-color:var(--coral);background:var(--coral-soft);color:var(--coral);cursor:default;}
  .add{font:inherit;font-size:14px;padding:9px 0;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--ink-soft);cursor:pointer;}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-top:12px;flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .dayoff{display:none;text-align:center;color:var(--ink-soft);font-size:14px;padding:18px 0 6px;}

  /* 每週固定 */
  .wk{display:grid;grid-template-columns:48px 44px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:14px;}
  .wk:first-of-type{border-top:0;}
  .wk b{font-size:15px;}
  .wk .t{display:flex;gap:6px;align-items:center;color:var(--ink-soft);min-width:0;}
  .wk .t.dim{opacity:.35;}
  select,input[type=time],input[type=text],input[type=number]{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);font-size:14px;}

  /* 需求單 */
  .req{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;}
  .req .h{display:flex;justify-content:space-between;align-items:baseline;}
  .req .h b{font-size:15px;}
  .req .h small{color:var(--ink-soft);font-size:12px;}
  .req p{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
  .tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;border:1px solid var(--olive);color:var(--olive-dark);margin:6px 4px 0 0;}
  .tag.new{border-color:var(--coral);color:var(--coral);}
  .form{display:none;margin-top:12px;background:var(--bg);border-radius:12px;padding:12px;}
  .form.show{display:block;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;font:inherit;font-size:13px;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .seg button.on{border-color:var(--charcoal);background:var(--charcoal);color:#fff;}
  .two{display:flex;gap:8px;align-items:center;}
  .two>*{flex:1;min-width:0;}
  .form input[type=date]{font:inherit;font-size:15px;padding:8px 6px;min-width:0;-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .form label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;}
  .form label:first-child{margin-top:0;}
  .form select,.form input{width:100%;}
  .go{display:block;width:100%;margin-top:14px;font:inherit;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--charcoal);color:#fff;cursor:pointer;}
  .go.coral{background:var(--coral);}
  .sm{font:inherit;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid var(--coral);background:#fff;color:var(--coral);cursor:pointer;margin-top:10px;}
  .login{text-align:center;padding:30px 0;}
  .login input{width:100%;margin-top:12px;}
  .list .it{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px dashed var(--line);padding:10px 0;font-size:14px;}
  .list .it:first-of-type{border-top:0;}
  .list .it small{display:block;color:var(--ink-soft);font-size:12.5px;}
  .x{font:inherit;font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .x.sure{border-color:var(--coral);background:var(--coral);color:#fff;}
  .link{margin-top:10px;font-size:13px;word-break:break-all;background:#fff;border:1px dashed var(--olive);border-radius:10px;padding:8px 10px;}
  .btns{display:flex;gap:8px;margin-top:8px;}
  .btns a,.btns button{flex:1;text-align:center;font:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;}
  .btns .l{background:#06C755;color:#fff;}
  .btns .c{background:var(--charcoal);color:#fff;}
  .addrow{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .cday{border-top:1px solid var(--line);padding:12px 0;}
  .cday.today .dt b{color:var(--coral);}
  .cday .dt{display:flex;align-items:center;justify-content:space-between;}
  .cday .dt b{font-size:15px;}
  .cday .dt small{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .cday.off .dt b{color:#aaa;}
  .cday .slots{margin-top:8px;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .cday .slot{font-size:13px;padding:7px 0;}
  .cday .slot small{font-size:10.5px;}
  .cday .add{font-size:13px;padding:7px 0;}
  .cday .addrow{margin-top:8px;}
  .mhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px;}
  .mhead button{font:inherit;font-size:18px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--charcoal);cursor:pointer;}
  .mhead select{flex:1;font:inherit;font-size:16px;font-weight:700;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
  .mgrid .wh{text-align:center;font-size:12px;color:var(--ink-soft);padding:2px 0;}
  .mgrid .wh:nth-child(7n+1),.mgrid .wh:nth-child(7n){color:var(--coral);}
  .mc{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;}
  .mc b{font-size:15px;line-height:1;}
  .mc small{font-size:10px;line-height:1.1;color:var(--ink-soft);}
  .mc .dots{display:flex;gap:2px;height:6px;}
  .mc .dots i{width:6px;height:6px;border-radius:50%;}
  .mc .dots .o{background:var(--olive);}
  .mc .dots .b{background:var(--coral);}
  .mc.blank{visibility:hidden;}
  .mc.past{opacity:.35;cursor:default;}
  .mc.off{background:#EFEAE2;}
  .mc.today b{color:var(--coral);}
  .mc.pick{outline:2px solid var(--charcoal);outline-offset:-1px;}
  .mc.na{opacity:.35;cursor:default;}
  .dayp{margin-top:14px;}
  .wkline{margin:14px 0 2px;font-size:12px;letter-spacing:2px;font-weight:700;color:var(--olive-dark);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--charcoal);color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;}
  .toast.show{opacity:1;}
  /* RWD：手機窄螢幕微調、平板加寬、電腦左右兩欄 */
  @media (max-width:359px){
    .wrap{padding:0 12px 60px;}
    .box{padding:16px 14px;}
    .wk{grid-template-columns:40px 40px 1fr;gap:6px;}
    .wk select{font-size:14px;padding:6px 4px;}
    .cday .slots{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  @media (min-width:700px){
    .wrap{max-width:720px;}
    .mc{aspect-ratio:auto;height:64px;}
    .cday .slots{grid-template-columns:repeat(5,minmax(0,1fr));}
  }
  @media (min-width:960px){
    .wrap{max-width:1120px;padding:0 32px 72px;}
    .box{padding:24px 28px;}
    .tabs{max-width:520px;}
    .calbox{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:36px;align-items:start;}
    .calhd{grid-column:1/-1;}
    .calbox .dayp{margin-top:6px;position:sticky;top:16px;border-left:1px dashed var(--line);padding-left:36px;min-height:240px;}
    .calbox .cday{border-top:0;padding-top:4px;}
    .mc{height:70px;}
    .mc b{font-size:16px;}
    .mc small{font-size:11px;}
    .cday .slots{grid-template-columns:repeat(4,minmax(0,1fr));}
    #blist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px;}
    #blist .it:nth-child(2){border-top:0;}
    #blist .hint{grid-column:1/-1;}
    .wkgrid:not([hidden]){display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:20px;align-items:start;}
    #rlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;}
    #rlist>.hint{grid-column:1/-1;}
    .mc:not(.past):not(.na):hover,.slot:not(.booked):hover,.act button:hover{border-color:var(--charcoal);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="images/logo.png" alt=""><b>教練後台</b><span id="who"></span></div>

  <div class="box login" id="login" hidden>
    <h2>請輸入後台密碼</h2>
    <input type="password" id="pw" placeholder="密碼">
    <button class="go" id="pw-go">進入</button>
  </div>

  <div id="app" hidden>
  <div class="tabs">
    <button class="on" data-tab="cal">時段</button>
    <button data-tab="req">需求單<span class="n" id="req-n" hidden></span></button>
    <button data-tab="wk">每週固定</button>
  </div>

  <section id="tab-cal">
    <div class="box calbox">
      <div class="calhd"><h2>行事曆</h2>
      <p class="hint">點日期，下面就能開／關那天的時段；點已預約的看客人資料。</p></div>
      <div class="calL">
      <div class="mhead"><button id="m-prev" aria-label="上個月">‹</button><select id="m-sel"></select><button id="m-next" aria-label="下個月">›</button></div>
      <div class="mgrid" id="mgrid"></div>
      <div class="legend"><span><i style="border:1px solid var(--olive)"></i>開放</span><span><i style="background:var(--coral-soft);border:1px solid var(--coral)"></i>已預約</span><span><i style="border:1px solid var(--line)"></i>關閉</span><span><i style="border:1px dashed var(--olive-dark);background:#EEF1E6"></i>進修</span></div>
      <button class="sm" id="st-open">＋ 設定進修區間</button>
      <div class="form" id="st-form">
        <label>日期</label>
        <div class="two"><input type="date" id="st-from"><span style="flex:0 0 auto">到</span><input type="date" id="st-to"></div>
        <label>時間</label>
        <div class="seg" id="st-all"><button data-v="1" class="on">整天</button><button data-v="0">選時間</button></div>
        <div class="two" id="st-time" style="display:none;margin-top:8px"><span id="st-s"></span><span style="flex:0 0 auto">到</span><span id="st-e"></span></div>
        <label>客人看到</label>
        <div class="seg" id="st-lab"><button data-v="studyFull" class="on">滿</button><button data-v="study">進修</button></div>
        <button class="go" id="st-go">套用</button>
        <button class="x" id="st-clear" style="margin-top:10px;width:100%;padding:8px">取消這段日期的進修</button>
      </div>
      </div>
      <div id="cal" class="dayp"></div>
    </div>
    <div class="box">
      <h2>接下來的預約</h2>
      <div class="list" id="blist"></div>
    </div>
  </section>

  <section id="tab-req" hidden>
    <div class="box">
      <h2>需求單</h2>
      <p class="hint">填好方案按送出，會產生方案卡連結，用 LINE 或簡訊傳給客人。</p>
      <div id="rlist"></div>
    </div>
  </section>

  <section id="tab-wk" class="wkgrid" hidden>
    <div class="box">
      <h2>每週固定時段</h2>
      <p class="hint">設定一次，之後每週自動開。臨時有事再到「時段」關掉那一格。</p>
      <div id="wk"></div>
      <button class="go" id="wk-go">儲存每週時段</button>
    </div>
    <div class="box">
      <h2>其他設定</h2>
      <div class="row"><span>每格多久</span><select id="step"><option value="30">30 分鐘</option><option value="60">60 分鐘</option><option value="90">90 分鐘</option><option value="120">120 分鐘</option></select></div>
      <div class="row"><span>最多開放幾天後</span><select id="ndays"><option>7</option><option>14</option><option>21</option><option>30</option></select></div>
      <div class="row"><span>最晚幾小時前要預約</span><select id="lead"><option value="0">不限</option><option value="1">1 小時</option><option value="3">3 小時</option><option value="12">12 小時</option><option value="24">前一天</option></select></div>
      <button class="go" id="set-go">儲存設定</button>
    </div>
  </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const API='https://script.google.com/macros/s/AKfycbwnbrXXw1kLhc--aVYD8hCJ2bObvyO0M5l4V5BDz3WmKyimXQYxrVk-SOzRSkjoumKJzQ/exec';
  const BOOK='https://chunbalance.com/book.html';
  const WN='一二三四五六日';
  const $=id=>document.getElementById(id);
  let K='', D=null, cur=0, YM='', PICK='', ACT='';
  try{K=new URLSearchParams(location.search).get('k')||localStorage.getItem('chunBookKey')||'';}catch(e){}

  function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);}
  function get(q){return fetch(API+'?'+new URLSearchParams(q)).then(r=>r.json());}
  function post(o){o.k=K;return fetch(API,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.msg);return r;});}
  const md=ds=>{const p=ds.split('-');return (+p[1])+'/'+(+p[2]);};
  const toMin=t=>{const p=t.split(':');return +p[0]*60+ +p[1];};
  const toTime=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  function sel(v,id){let h='<select'+(id?' id="'+id+'"':'')+'>';for(let m=7*60;m<=23*60;m+=30){const t=toTime(m);h+='<option'+(t===v?' selected':'')+'>'+t+'</option>';}return h+'</select>';}
  // 兩下確認（網頁不能跳確認框）
  function twoTap(b,label,fn){b.onclick=()=>{if(b.classList.contains('sure')){fn();return;}b.classList.add('sure');b.textContent='再按一次確認';setTimeout(()=>{b.classList.remove('sure');b.textContent=label;},3000);};}

  // 每個月的資料先存起來，切換月份直接用；前後月份先在背景讀好
  let CACHE={}, LOADING=false;
  function fetchMonth(ym){
    const [y,m]=ym.split('-').map(Number), n=new Date(Date.UTC(y,m,0)).getUTCDate();
    return get({a:'admin',k:K,from:ym+'-01',n}).then(r=>{if(r.ok)CACHE[ym]=r;return r;});
  }
  function prefetch(){[-1,1].forEach(k=>{const v=ymAdd(YM,k);if(!CACHE[v])fetchMonth(v).catch(()=>{});});}
  function load(){
    if(!YM){const t=new Date(Date.now()+8*3600e3).toISOString();YM=t.slice(0,7);PICK=t.slice(0,10);}
    const ym=YM;CACHE={};
    return fetchMonth(ym).then(r=>{
      if(!r.ok){if(/密碼/.test(r.msg)){showLogin();return;}throw new Error(r.msg);}
      try{localStorage.setItem('chunBookKey',K);}catch(e){}
      $('login').hidden=true;$('app').hidden=false;$('who').textContent='馬克';
      if(ym===YM){D=r;LOADING=false;drawCal();}
      drawReq();drawWeek();prefetch();
    }).catch(e=>toast(e.message||'讀取失敗'));
  }
  // 操作時不整頁重畫：畫面先變，資料在背景存；全部存完才安靜地對一次資料
  let PENDING=0, LASTREQ='';
  function mutate(o){
    PENDING++;
    return post(o).catch(e=>{toast(/不明/.test(e.message)?'程式要先更新到最新版':e.message);FORCE=true;throw e;})
      .finally(()=>{PENDING--;if(!PENDING)quietRefresh();});
  }
  let FORCE=false;
  function quietRefresh(){
    const ym=YM;CACHE={};
    fetchMonth(ym).then(r=>{
      if(!r.ok||PENDING||ym!==YM) return;
      const busy=ACT||document.querySelector('#cal .addrow')||$('st-form').classList.contains('show');
      const same=JSON.stringify(r.days)===JSON.stringify(D.days);
      D=r;
      if(FORCE||(!busy&&!same)){FORCE=false;keepScroll(drawCal);} else drawList();
      const rq=JSON.stringify(r.requests);if(rq!==LASTREQ)drawReq();
      prefetch();
    }).catch(()=>{});
  }
  function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
  function showLogin(){$('app').hidden=true;$('login').hidden=false;}
  $('pw-go').onclick=()=>{K=$('pw').value.trim();load();};

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    ['cal','req','wk'].forEach(t=>$('tab-'+t).hidden=t!==b.dataset.tab);
  });

  // ===== 時段 =====
  // ===== 時段（月曆） =====
  const today=()=>D&&D.today||new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  function ymAdd(ym,k){let [y,m]=ym.split('-').map(Number);m+=k;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+String(m).padStart(2,'0');}
  function goMonth(ym){
    YM=ym;PICK=ym===today().slice(0,7)?today():ym+'-01';
    if(CACHE[ym]){D=CACHE[ym];LOADING=false;drawCal();prefetch();return;}
    LOADING=true;drawCal();
    fetchMonth(ym).then(r=>{if(ym!==YM)return;if(!r.ok)throw new Error(r.msg);D=r;LOADING=false;drawCal();prefetch();}).catch(e=>toast(e.message||'讀取失敗'));
  }
  $('m-prev').onclick=()=>goMonth(ymAdd(YM,-1));
  $('m-next').onclick=()=>goMonth(ymAdd(YM,1));
  $('m-sel').onchange=e=>goMonth(e.target.value);
  function drawCal(){
    // 年月下拉：今年起往前 2 個月、往後 12 個月
    const base=today().slice(0,7);let opt='';
    for(let k=-2;k<=12;k++){const v=ymAdd(base,k);opt+='<option value="'+v+'"'+(v===YM?' selected':'')+'>'+v.slice(0,4)+' 年 '+(+v.slice(5))+' 月</option>';}
    $('m-sel').innerHTML=opt;
    const map={};if(!LOADING)D.days.forEach(d=>map[d.date]=d);
    const [y,m]=YM.split('-').map(Number), n=new Date(Date.UTC(y,m,0)).getUTCDate();
    const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(); // 0=日
    const g=$('mgrid');g.innerHTML=[...'日一二三四五六'].map(w=>'<div class="wh">'+w+'</div>').join('')+'<div class="mc blank"></div>'.repeat(first);
    const td=today();
    for(let i=1;i<=n;i++){
      const ds=YM+'-'+String(i).padStart(2,'0'), d=map[ds], c=document.createElement('button');
      let cls='mc', info='';
      if(ds<td) cls+=' past';
      else if(!d) cls+=' na';
      else{
        const bk=d.slots.filter(s=>s.state==='booked'&&!s.cont).length, op=d.slots.filter(s=>s.state==='open').length;
        if(d.dayOff){cls+=' off';info='<small>休息</small>';}
        else info='<span class="dots">'+(bk?'<i class="b"></i>':'')+(op?'<i class="o"></i>':'')+'</span><small>'+(bk?bk+'約':op?op+'空':'')+'</small>';
      }
      if(ds===td) cls+=' today';
      if(ds===PICK) cls+=' pick';
      c.className=cls;c.innerHTML='<b>'+i+'</b>'+info;
      if(d&&ds>=td) c.onclick=()=>{PICK=ds;ACT='';keepScroll(drawCal);};
      g.appendChild(c);
    }
    drawDay(map[PICK]&&PICK>=td?map[PICK]:null);
    drawList();
  }
  function drawDay(d){
    const box=$('cal');box.innerHTML='';
    if(LOADING){box.innerHTML='<p class="hint">讀取中…</p>';return;}
    if(!d){box.innerHTML='<p class="hint">'+(D.today?'點上面的日期來調整時段。':'程式還沒更新到新版，暫時只能看最近兩週。')+'</p>';return;}
    const el=document.createElement('div');el.className='cday'+(d.dayOff?' off':'');
    const bk=d.slots.filter(s=>s.state==='booked'&&!s.cont).length, op=d.slots.filter(s=>s.state==='open').length;
    el.innerHTML='<div class="dt"><div><b>'+md(d.date)+'（'+d.w+'）</b><small>'+(d.dayOff?'休息':!d.slots.length?'沒開，可按＋加':(bk?bk+' 約・':'')+op+' 空')+'</small></div>'+
      '<label class="sw"><input type="checkbox"'+(d.dayOff?'':' checked')+'><span></span></label></div>';
    el.querySelector('input').onchange=e=>{d.dayOff=!e.target.checked;keepScroll(drawCal);mutate({a:'toggleDay',date:d.date,off:d.dayOff}).catch(()=>{});};
    if(!d.dayOff){
      const sb=document.createElement('div');sb.className='slots';
      d.slots.forEach(s=>{
        const b=document.createElement('button');
        b.className='slot'+(s.state==='booked'?' booked':s.state==='open'?'':' '+s.state);
        b.innerHTML=s.time+(s.state==='booked'?'<small>'+(s.cont?'↑ 續':s.name)+'</small>':s.state==='study'?'<small>進修</small>':s.state==='studyFull'?'<small>進修・顯示滿</small>':'');
        b.onclick=()=>{
          if(s.state==='booked'){toast(s.name+' '+s.phone+'｜'+s.service);return;}
          ACT=ACT===d.date+' '+s.time?'':d.date+' '+s.time;keepScroll(drawCal);
        };
        sb.appendChild(b);
      });
      // 點時段後出現的選項：開放／關閉／進修（客人看到「滿」或「進修」）
      const ac=d.slots.find(s=>ACT===d.date+' '+s.time&&s.state!=='booked');
      let box2=null;
      if(ac){
        box2=document.createElement('div');box2.className='act';
        box2.innerHTML='<p>'+ac.time+' 要怎麼設？</p><div class="g">'+
          [['open','開放'],['closed','關閉（客人看不到）'],['studyFull','進修，客人看到「滿」'],['study','進修，客人看到「進修」']]
            .map(([k,l])=>'<button data-k="'+k+'"'+(ac.state===k?' class="on"':'')+'>'+l+'</button>').join('')+'</div>';
        box2.querySelectorAll('button').forEach(x=>x.onclick=()=>{
          const st=x.dataset.k;ACT='';
          if(st===ac.state){keepScroll(drawCal);return;}
          ac.state=st;keepScroll(drawCal);
          mutate({a:'setSlot',date:d.date,time:ac.time,state:st}).catch(()=>{});
        });
      }
      const a=document.createElement('button');a.className='add';a.textContent='＋';
      a.onclick=()=>{
        if(el.querySelector('.addrow')) return;
        const r=document.createElement('div');r.className='addrow';r.innerHTML=sel('19:00')+'<button class="sm" style="margin:0">加這個時段</button>';
        r.querySelector('button').onclick=()=>{
          const t=r.querySelector('select').value;
          if(!d.slots.some(x=>x.time===t)){d.slots.push({time:t,state:'open',name:'',phone:'',service:'',id:''});d.slots.sort((x,y)=>x.time<y.time?-1:1);}
          d.dayOff=false;keepScroll(drawCal);toast('已加時段');
          mutate({a:'addSlot',date:d.date,time:t}).catch(()=>{});
        };
        el.appendChild(r);
      };
      sb.appendChild(a);el.appendChild(sb);if(box2)el.appendChild(box2);
    }
    box.appendChild(el);
  }
  function drawList(){
    // 接下來的預約（新版程式給全部；舊版只看得到這次拿到的日子）
    let list=D.upcoming;
    if(!list){list=[];D.days.forEach(x=>x.slots.forEach(s=>{if(s.state==='booked'&&!s.cont)list.push(Object.assign({date:x.date,w:x.w},s));}));}
    $('blist').innerHTML=list.length?'':'<p class="hint">還沒有預約</p>';
    list.forEach(s=>{
      const it=document.createElement('div');it.className='it';
      it.innerHTML='<div><b>'+md(s.date)+'（'+s.w+'）'+s.time+'　'+s.name+'</b><small>'+s.service+'｜<a href="tel:'+s.phone+'">'+s.phone+'</a></small></div>';
      const x=document.createElement('button');x.className='x';x.textContent='取消';
      twoTap(x,'取消',()=>{
        // 先從畫面拿掉，背景再存
        if(D.upcoming) D.upcoming=D.upcoming.filter(u=>u.id!==s.id);
        D.days.forEach(dd=>dd.slots.forEach(z=>{if(z.id===s.id){z.state='open';z.name='';z.id='';}}));
        keepScroll(drawCal);toast('已取消');
        mutate({a:'cancel',id:s.id}).catch(()=>{});
      });
      it.appendChild(x);$('blist').appendChild(it);
    });
  }

  // ===== 進修區間 =====
  $('st-s').innerHTML=sel('09:00','st-start');$('st-e').innerHTML=sel('18:00','st-end');
  function seg(id){const b=$(id);b.querySelectorAll('button').forEach(x=>x.onclick=()=>{b.querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===x));if(id==='st-all')$('st-time').style.display=x.dataset.v==='1'?'none':'flex';});}
  seg('st-all');seg('st-lab');
  const segV=id=>$(id).querySelector('button.on').dataset.v;
  $('st-open').onclick=()=>{const f=$('st-form');f.classList.toggle('show');if(!$('st-from').value){$('st-from').value=PICK;$('st-to').value=PICK;}};
  $('st-from').onchange=()=>{if(!$('st-to').value||$('st-to').value<$('st-from').value)$('st-to').value=$('st-from').value;};
  function studyRange(state){
    const o={a:'studyRange',from:$('st-from').value,to:$('st-to').value,state};
    if(!o.from) return toast('請選日期');
    if(segV('st-all')==='0'){o.start=$('st-start').value;o.end=$('st-end').value;}
    return mutate(o).then(r=>{toast((state==='clear'?'已取消 ':'已設定 ')+r.count+' 個時段'+(r.skipped?'，'+r.skipped+' 個已有人約沒動':''));$('st-form').classList.remove('show');FORCE=true;})
      .catch(()=>{});
  }
  $('st-go').onclick=()=>studyRange(segV('st-lab'));
  twoTap($('st-clear'),'取消這段日期的進修',()=>studyRange('clear'));

  // ===== 需求單 =====
  function planUrl(id){return BOOK+'?plan='+id;}
  function drawReq(){
    LASTREQ=JSON.stringify(D.requests);
    const n=D.requests.filter(r=>r.status==='待回覆').length;
    $('req-n').hidden=!n;$('req-n').textContent=n;
    const box=$('rlist');box.innerHTML=D.requests.length?'':'<p class="hint" style="margin-top:10px">目前沒有需求單</p>';
    const free=[];(D.available||[]).forEach(d=>d.slots.forEach(t=>free.push({date:d.date,w:d.w,time:t})));
    D.requests.forEach(r=>{
      const el=document.createElement('div');el.className='req';
      const tags=(r.dirs?r.dirs.split('、'):[]).map(t=>'<span class="tag">'+t+'</span>').join('')+(r.when?'<span class="tag">'+r.when+'</span>':'');
      const opts=free.map(f=>'<option value="'+f.date+' '+f.time+'"'+(r.date===f.date&&r.time===f.time?' selected':'')+'>'+md(f.date)+'（'+f.w+'）'+f.time+'</option>').join('');
      const keep=r.date&&!free.some(f=>f.date===r.date&&f.time===r.time)?'<option value="'+r.date+' '+r.time+'" selected>'+md(r.date)+' '+r.time+'（已送出）</option>':'';
      el.innerHTML='<div class="h"><b>'+r.name+'</b><small>'+r.at.slice(5)+'</small></div>'+
        '<span class="tag new">'+(r.status==='待回覆'?'待回覆':'已回方案，等客人按')+'</span>'+tags+
        (r.text?'<p>'+r.text.replace(/</g,'&lt;')+'</p>':'')+
        '<p><a href="tel:'+r.phone+'">'+r.phone+'</a></p>'+
        '<button class="sm">'+(r.status==='待回覆'?'回方案卡':'看／改方案卡')+'</button>'+
        '<div class="form"><label>方案</label><select class="f-plan">'+D.services.filter(s=>s.price).map(s=>'<option data-p="'+s.price+'"'+(r.plan===s.name?' selected':'')+'>'+s.name+'</option>').join('')+'</select>'+
        '<label>價格</label><input type="number" class="f-price" value="'+(r.price||'')+'">'+
        '<label>時間（從你開放的時段選）</label><select class="f-time">'+keep+opts+'</select>'+
        '<label>加購</label><select class="f-addon"><option value="">不加購</option><option'+(r.addon?' selected':'')+'>足弓墊（現場評估）</option></select>'+
        '<label>給客人的一句話</label><input type="text" class="f-note" maxlength="100" value="'+(r.note||'').replace(/"/g,'&quot;')+'">'+
        '<button class="go coral f-go">送出方案卡</button><div class="f-out"></div>'+
        '<button class="x f-close" style="margin-top:10px">不用回了，收起來</button></div>';
      const f=el.querySelector('.form'), ps=el.querySelector('.f-plan'), pr=el.querySelector('.f-price');
      el.querySelector('.sm').onclick=()=>f.classList.toggle('show');
      if(!pr.value) pr.value=ps.selectedOptions[0]?ps.selectedOptions[0].dataset.p:'';
      ps.onchange=()=>{pr.value=ps.selectedOptions[0].dataset.p;};
      if(r.status==='已回方案') showLink(el,r);
      el.querySelector('.f-go').onclick=()=>{
        const tv=el.querySelector('.f-time').value;
        if(!tv) return toast('目前沒有開放的時段，先去「時段」開');
        const [date,time]=tv.split(' ');
        post({a:'sendPlan',id:r.id,plan:ps.value,price:pr.value,date,time,addon:el.querySelector('.f-addon').value,note:el.querySelector('.f-note').value})
          .then(()=>{toast('方案卡已產生');showLink(el,r);}).catch(e=>toast(e.message));
      };
      twoTap(el.querySelector('.f-close'),'不用回了，收起來',()=>{D.requests=D.requests.filter(q=>q.id!==r.id);drawReq();mutate({a:'closeRequest',id:r.id}).catch(()=>{});});
      box.appendChild(el);
    });
  }
  function showLink(el,r){
    const url=planUrl(r.id), msg=r.name+' 你好，這是鈞衡舍為你準備的方案卡，確認後按「預約這個方案」就完成預約：\n'+url;
    el.querySelector('.f-out').innerHTML='<div class="link">'+url+'</div><div class="btns"><a class="l" href="https://line.me/R/share?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">用 LINE 傳</a><a class="c" href="sms:'+r.phone+'?&body='+encodeURIComponent(msg)+'">用簡訊傳</a><button class="c f-copy">複製</button></div>';
    el.querySelector('.f-copy').onclick=()=>{navigator.clipboard.writeText(msg).then(()=>toast('已複製'),()=>toast('複製失敗，請長按連結'));};
  }

  // ===== 每週固定 =====
  function drawWeek(){
    const box=$('wk');box.innerHTML='';
    D.week.forEach((w,n)=>{
      const r=document.createElement('div');r.className='wk';
      r.innerHTML='<b>週'+WN[n]+'</b><label class="sw"><input type="checkbox"'+(w.open?' checked':'')+'><span></span></label><div class="t'+(w.open?'':' dim')+'">'+sel(w.start)+' – '+sel(w.end)+'</div>';
      const cb=r.querySelector('input');cb.onchange=()=>r.querySelector('.t').classList.toggle('dim',!cb.checked);
      box.appendChild(r);
    });
    $('step').value=String(D.settings.step);$('ndays').value=String(D.settings.days);$('lead').value=String(D.settings.lead);
  }
  $('wk-go').onclick=()=>{
    const week=[...document.querySelectorAll('#wk .wk')].map(r=>{const s=r.querySelectorAll('select');return {open:r.querySelector('input').checked,start:s[0].value,end:s[1].value};});
    if(week.some(w=>w.open&&toMin(w.end)<=toMin(w.start))) return toast('結束時間要比開始晚');
    toast('已儲存');FORCE=true;mutate({a:'setWeek',week}).catch(()=>{});
  };
  $('set-go').onclick=()=>{toast('已儲存');FORCE=true;mutate({a:'setSettings',step:$('step').value,days:$('ndays').value,lead:$('lead').value}).catch(()=>{});};

  if(K) load(); else showLogin();
</script>
</body>
</html>
