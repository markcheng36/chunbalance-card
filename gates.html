<style>
/* Layout: one-screen game. HUD + gate strip, meters, hint, canvas stage (two-finger play), choice panel for 拆解; overlays */
:root{
  --bg:#ece9e2; --paper:#faf8f3; --ink:#232a2c; --muted:#666c69; --line:#d4d0c6;
  --red:#c1553d; --ok:#3f8f6b; --gold:#c99a2e; --blue:#4a7fa8;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
#hearts{color:var(--red);font-size:20px;letter-spacing:2px}
#score{font-weight:700;font-size:18px;text-align:right}
#gates{display:flex;justify-content:center;gap:4px}
#gates span{font-family:var(--serif);font-weight:700;font-size:14px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--paper);color:var(--muted);border:1.5px solid var(--line)}
#gates span.now{background:var(--ink);color:#fff;border-color:var(--ink)}
#gates span.done{background:var(--ok);color:#fff;border-color:var(--ok)}
#meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;font-size:11px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#mB i{background:var(--red)}
#hint{margin-top:6px;text-align:center;font-size:15px;font-weight:700;min-height:22px;line-height:1.4}
#stage{flex:1;min-height:0;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#choices button{font:inherit;font-size:13px;font-weight:700;padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#choices button.wrong{border-color:var(--red);color:var(--red)}
#choices button:focus-visible{outline:3px solid var(--ink)}
.ov{position:absolute;inset:0;background:rgba(236,233,226,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:5;overflow-y:auto}
.ov h1{font-family:var(--serif);font-weight:900;font-size:46px;margin:0;line-height:1.1}
.ov h1 em{font-style:normal;color:var(--red)}
.ov h2{font-family:var(--serif);font-size:34px;margin:0}
.ov p{margin:0;line-height:1.75;color:var(--muted);font-size:15px;max-width:30em}
.ov p b{color:var(--ink)}
.ov blockquote{margin:0;font-family:var(--serif);font-size:16px;line-height:1.7;max-width:26em;border-left:3px solid var(--gold);padding-left:12px;text-align:left}
.five{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.five span{font-family:var(--serif);font-weight:700;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 10px}
.mini{font-size:12px!important}
.how{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;max-width:26em;font-size:15px;line-height:1.7}
.how b{color:var(--red)}
button.main,.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:28px;padding:13px 30px;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;display:inline-block}
button.main:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.line{background:#06c755}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#shareImg{width:min(100%,290px);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.15);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
</style>

<body>


<div id="app">
  <div id="hud">
    <div id="hearts">♥♥♥</div>
    <div id="gates"><span>合</span><span>環</span><span>串</span><span>收</span><span>拆</span></div>
    <div id="score">0</div>
  </div>
  <div id="meters">
    <div><span id="mAlabel">進度</span><div class="bar" id="mA"><i></i></div></div>
    <div><span id="mBlabel">太用力</span>　<span id="tleft"></span><div class="bar" id="mB"><i></i></div></div>
  </div>
  <div id="hint"></div>
  <div id="stage">
    <canvas id="c" width="600" height="760"></canvas>

    <div class="ov" id="ovStart">
      <div class="mini" style="color:var(--muted);letter-spacing:.1em">鈞衡舍 ChunBalance</div>
      <h1>結構<em>五</em>關</h1>
      <div class="five"><span>合力</span><span>環鬆</span><span>串勁</span><span>收軸</span><span>拆解</span></div>
      <p>你是調整師，<b>兩隻手指就是你的上手和下手</b>，要合作才能過關。五關全過就拿到認證。</p>
      <p class="mini">手機上請用兩根手指玩。電腦版：先點一下放下第一指（會釘住），再用滑鼠當第二指。<br>遊戲是簡化版，真正的手法要經過專業訓練。</p>
      <button class="main" id="btnStart">開始闖關</button>
    </div>

    <div class="ov" id="ovGate" hidden>
      <div class="mini" id="gNum" style="color:var(--muted);letter-spacing:.1em"></div>
      <h2 id="gTitle"></h2>
      <blockquote id="gQuote"></blockquote>
      <div class="how" id="gHow"></div>
      <button class="main" id="btnGo">開始</button>
    </div>

    <div class="ov" id="ovEnd" hidden>
      <h2 id="endTitle"></h2>
      <img id="shareImg" alt="結構五關成績卡">
      <p class="mini">長按圖片可以存起來或傳給朋友</p>
      <p>遊戲裡你是調整師。想親身感受五關的鬆，讓馬克幫你調一次。</p>
      <div class="row"><a class="btn line" href="https://line.me/R/ti/p/@chunbalance" target="_blank" rel="noopener">加官方 LINE 找馬克</a></div>
      <div class="row">
        <a class="btn alt" href="https://markcheng36.github.io/chunbalance-card/book.html" target="_blank" rel="noopener">線上預約</a>
        <button class="btn alt" id="btnAgain">再闖一次</button>
      </div>
    <p class="learn" style="font-size:13px;line-height:1.6;margin:12px 0 0;text-align:center;color:inherit;opacity:.85">想學這套身體結構技術嗎？請洽 <a href="https://strxhunter.com/" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">結構X獵人 strxhunter.com</a></p>
    </div>
  </div>
  <div id="choices" hidden></div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=600,H=760,$=id=>document.getElementById(id);
const C={ink:'#232a2c',muted:'#666c69',line:'#d4d0c6',red:'#c1553d',ok:'#3f8f6b',gold:'#c99a2e',blue:'#4a7fa8',skin:'#f1dccb',skinD:'#d9bba3',paper:'#faf8f3'};
const N={tip:[50,520],hand:[118,505],wrist:[170,520],elbow:[405,520],delt:[425,345],sh:[430,250]};
const NAME={wrist:'腕',elbow:'肘',delt:'三角肌止點',sh:'肩'};
const GATES=[
 {k:'合力',q:'彼此的鬆感互相滲入，力量像水一樣流動，柔和卻有方向，在鬆中找到重心。',
  how:'手指按住手臂就是抓住它，拖動時關節會跟著轉。<br><b>下手</b>抓前臂、<b>上手</b>抓上臂靠肘，兩手一起把手臂帶到<b>肘彎 90 度</b>（虛線），然後穩住。<br>個案的張力會一直變，兩手要一起微調。',T:45},
 {k:'環鬆',q:'像風箏的線，始終牽著，不緊繃、不放掉，卻維持著穩定的張力。',
  how:'一指抓<b>上臂</b>帶著肩關節轉，一指抓<b>前臂</b>帶著肘關節轉，兩邊<b>一起來回轉</b>。<br>轉著轉著筋膜皺褶會攤開，合力線<b>拉成一直線</b>。轉太快會緊繃。',T:45},
 {k:'串勁',q:'把旋轉扭曲的拉力線一路攤平，跨關節串到肩上的三角肌止點。',
  how:'一指<b>按住上方關節</b>（金色圈），另一指<b>拖著手臂</b>走：<br>① 按住肘，把手肘拉直<br>② 按住肩，把整隻手臂舉到斜上方<br>③ 按住肩，慢慢放下<b>卸勁</b><br>按住的手指放開，勁就散了。',T:60},
 {k:'收軸',q:'以坐骨為重心支點，脊椎一節一節往上延伸，回到平衡。',
  how:'<b>前置：先確認呼吸</b>。按住吸氣、放開吐氣，要吸到<b>肚臍以下</b>才算，做 3 次。<br>呼吸到位後，脊椎一節一節晃，<b>對準坐骨正上方</b>時點一下疊上去。',T:75},
 {k:'拆解',q:'找出根源結構失衡的部位，共六項判斷依據。',
  how:'前四關做完，手臂上還有幾個<b>沒鬆開的卡點</b>。<br>一指沿著手臂<b>慢慢摸</b>，拉力線抖動的地方就是卡點。<br>在卡點上<b>按住不動</b>，它就會被拆開，並告訴你它是哪一種根源。',T:60},
];
let S;function reset(){S={g:0,hearts:3,score:0,run:false,passed:0,stats:[]};}reset();

// ---------- multi-finger input (touch = real fingers; mouse click = pin a finger, drag = second finger)
const F=new Map();let pinSeq=0,mouseDown=null;
const view={s:1,ox:0,oy:0,dpr:1};
function toLocal(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-view.ox)/view.s,(e.clientY-r.top-view.oy)/view.s];}
function newF(id,x,y,pin){return{id,x,y,vx:0,vy:0,sp:0,t:performance.now(),pin:!!pin,born:performance.now()};}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const [x,y]=toLocal(e);
  if(e.pointerType==='mouse'){mouseDown={x,y,t:performance.now(),moved:false};F.set('m',newF('m',x,y));}
  else F.set(e.pointerId,newF(e.pointerId,x,y));G&&G.down&&G.down(F.get(e.pointerType==='mouse'?'m':e.pointerId));});
cv.addEventListener('pointermove',e=>{const id=e.pointerType==='mouse'?'m':e.pointerId,f=F.get(id);if(!f)return;const [x,y]=toLocal(e),now=performance.now(),dt=Math.max(1,now-f.t)/1000;
  f.vx=f.vx*.6+(x-f.x)/dt*.4;f.vy=f.vy*.6+(y-f.y)/dt*.4;f.sp=Math.hypot(f.vx,f.vy);f.x=x;f.y=y;f.t=now;
  if(mouseDown&&id==='m'&&Math.hypot(x-mouseDown.x,y-mouseDown.y)>8)mouseDown.moved=true;});
function lift(e){const id=e.pointerType==='mouse'?'m':e.pointerId,f=F.get(id);if(!f)return;F.delete(id);G&&G.up&&G.up(f);
  if(id==='m'&&mouseDown&&!mouseDown.moved&&performance.now()-mouseDown.t<300&&G&&G.pins){
    const hit=[...F.values()].find(p=>p.pin&&Math.hypot(p.x-f.x,p.y-f.y)<30);
    if(hit){F.delete(hit.id);G.up&&G.up(hit);}else{const p=newF('pin'+(++pinSeq),f.x,f.y,true);F.set(p.id,p);G.down&&G.down(p);}}
  mouseDown=null;}
cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);
const fingers=()=>[...F.values()];
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
  const s=Math.min(r.width/W,r.height/H);Object.assign(view,{s,ox:(r.width-W*s)/2,oy:(r.height-H*s)/2,dpr:d});}
addEventListener('resize',fit);

let ac=null;function beep(f,d,t='sine',v=.07){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}
function hint(t,col){const h=$('hint');if(h.innerHTML!==t)h.innerHTML=t;h.style.color=col||'var(--ink)';}
function meters(a,b,la,lb){$('mA').firstElementChild.style.width=Math.min(100,a*100)+'%';$('mB').firstElementChild.style.width=Math.min(100,b*100)+'%';if(la)$('mAlabel').textContent=la;if(lb!==undefined)$('mBlabel').textContent=lb;}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];

// ---------- drawing helpers
function drawArm(c){
  c.save();c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=C.skinD;c.lineWidth=96;c.beginPath();c.moveTo(N.wrist[0],N.wrist[1]);c.lineTo(N.elbow[0],N.elbow[1]);c.lineTo(N.sh[0],N.sh[1]-10);c.stroke();
  c.strokeStyle=C.skin;c.lineWidth=90;c.stroke();
  c.fillStyle=C.skin;c.strokeStyle=C.skinD;c.lineWidth=3;c.beginPath();c.ellipse(115,520,62,40,0,0,7);c.fill();c.stroke();
  for(let i=0;i<4;i++){c.beginPath();c.ellipse(52,498+i*15,26,7,0,0,7);c.fill();c.stroke();}
  c.beginPath();c.ellipse(140,478,30,12,-.6,0,7);c.fill();c.stroke();
  c.beginPath();c.arc(N.sh[0],N.sh[1]-20,62,Math.PI,0);c.fill();
  c.restore();
}
function label(c,t,x,y,col,size=16){c.font=`bold ${size}px sans-serif`;c.textAlign='center';const w=c.measureText(t).width+14;
  c.fillStyle='rgba(250,248,243,.92)';c.fillRect(x-w/2,y-size-2,w,size+10);c.fillStyle=col||C.ink;c.fillText(t,x,y+2);}
function ring(c,p,r,col,dash,lw=3){c.beginPath();c.arc(p[0],p[1],r,0,7);c.setLineDash(dash?[6,6]:[]);c.strokeStyle=col;c.lineWidth=lw;c.stroke();c.setLineDash([]);}
function drawFingers(c){fingers().forEach(f=>{c.beginPath();c.arc(f.x,f.y,24,0,7);c.fillStyle=f.pin?'rgba(201,154,46,.35)':'rgba(35,42,44,.15)';c.fill();
  if(f.pin){c.strokeStyle=C.gold;c.lineWidth=2;c.stroke();}});}
function wavy(c,a,b,amp,col,lw,phase=0){c.beginPath();const L=dist(a,b),nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
  for(let j=0;j<=30;j++){const t=j/30,p=lerp(a,b,t),w=Math.sin(t*Math.PI*5+phase)*amp*Math.sin(t*Math.PI);j?c.lineTo(p[0]+nx*w,p[1]+ny*w):c.moveTo(p[0]+nx*w,p[1]+ny*w);}
  c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.stroke();}
// zone ownership helper: assign a finger to each named zone when it lands inside
function Owners(zones){const own={};return{
  update(){for(const k in zones){if(own[k]&&!F.has(own[k]))own[k]=null;}
    fingers().forEach(f=>{if(Object.values(own).includes(f.id))return;for(const k in zones){const z=zones[k];if(!own[k]&&dist([f.x,f.y],z.p)<z.r){own[k]=f.id;f.y0=f.y;f.lastA=null;f.om=0;break;}}});},
  get(k){return own[k]?F.get(own[k]):null;},clear(){for(const k in own)own[k]=null;}};}

// ================= Kinematic arm (gates 1-3): fingers grab a segment and drag it, joints follow =================
const SH=[440,290],LU=190,LF=170,LH=60,PI=Math.PI;
const ARM={tU:PI/2,phi:0,grab:new Map(),grav:true,whole:false,
  reset(tU=PI/2,phi=0){this.tU=tU;this.phi=phi;this.grab.clear();},
  get E(){return[SH[0]+Math.cos(this.tU)*LU,SH[1]+Math.sin(this.tU)*LU];},
  get tF(){return this.tU+this.phi;},
  get Wr(){const E=this.E;return[E[0]+Math.cos(this.tF)*LF,E[1]+Math.sin(this.tF)*LF];},
  get Hd(){const w=this.Wr;return[w[0]+Math.cos(this.tF)*LH,w[1]+Math.sin(this.tF)*LH];},
  pt(seg,t){if(seg==='U')return lerp(SH,this.E,t);const E=this.E,h=this.Hd;return lerp(E,h,t);}};
const near=(a,b)=>{let d=a-b;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d;};
function segHit(p,a,b){const ab=[b[0]-a[0],b[1]-a[1]],L2=ab[0]**2+ab[1]**2,t=clamp(((p[0]-a[0])*ab[0]+(p[1]-a[1])*ab[1])/L2,0,1);return{t,d:dist(p,lerp(a,b,t))};}
function armGrab(f){const p=[f.x,f.y];if(dist(p,SH)<40){ARM.grab.set(f.id,{seg:'S'});return;}
  const u=segHit(p,SH,ARM.E),fo=segHit(p,ARM.E,ARM.Hd);
  if(fo.d<55&&(fo.d<=u.d||fo.t>.15))ARM.grab.set(f.id,{seg:'F',t:Math.max(.25,fo.t)});
  else if(u.d<55)ARM.grab.set(f.id,{seg:'U',t:Math.max(.3,u.t)});}
function armRelease(f){ARM.grab.delete(f.id);}
const grabbed=seg=>{for(const [id,g] of ARM.grab){if(g.seg===seg&&F.has(id))return F.get(id);}return null;};
function armStep(dt,drift=[0,0]){
  for(const id of [...ARM.grab.keys()])if(!F.has(id))ARM.grab.delete(id);
  const fu=grabbed('U'),ff=grabbed('F');const pU=ARM.tU,pP=ARM.phi;
  if(ARM.whole&&ff&&!fu){ARM.tU=clamp(ARM.tU+near(Math.atan2(ff.y-SH[1],ff.x-SH[0]),ARM.tU)+drift[0],PI/2-.35,PI+1);}
  else{
    if(fu)ARM.tU=clamp(ARM.tU+near(Math.atan2(fu.y-SH[1],fu.x-SH[0])+drift[0],ARM.tU),PI/2-.35,PI+1);
    else if(ARM.grav)ARM.tU+=near(PI/2,ARM.tU)*Math.min(1,dt*1.5);
    if(ff){const E=ARM.E;ARM.phi=clamp(near(Math.atan2(ff.y-E[1],ff.x-E[0])+drift[1],ARM.tU),0,2.6);}
    else if(ARM.grav)ARM.phi=clamp(ARM.phi+near(PI/2,ARM.tF)*Math.min(1,dt*1.5),0,2.6);}
  ARM.wU=near(ARM.tU,pU)/dt;ARM.wF=(ARM.phi-pP)/dt;
}
function drawKArm(c,opt={}){
  const E=ARM.E,Wr=ARM.Wr,Hd=ARM.Hd;c.save();c.lineCap='round';c.lineJoin='round';
  // torso edge
  c.fillStyle=C.skin;c.strokeStyle=C.skinD;c.lineWidth=3;c.beginPath();c.moveTo(600,200);c.quadraticCurveTo(470,205,455,270);c.lineTo(480,760);c.lineTo(600,760);c.closePath();c.fill();c.stroke();

      [['U',SH,ARM.E],['F',ARM.E,ARM.Hd]].forEach(([seg,a,b])=>{c.beginPath();const L=dist(a,b),nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
        for(let j=0;j<=60;j++){const t=j/60;let w=0;spots.forEach(s=>{if(s.seg!==seg||s.ok)return;const d=Math.abs(t-s.t);if(d<.12)w+=(1-d/.12)*(8+s.feel*10)*Math.sin(performance.now()/(60-s.feel*30)+j);});
          const p=lerp(a,b,t);j?c.lineTo(p[0]+nx*w,p[1]+ny*w):c.moveTo(p[0]+nx*w,p[1]+ny*w);}
        c.strokeStyle=all?C.ok:C.red;c.lineWidth=all?7:4;c.lineCap='round';c.stroke();});
      spots.forEach(s=>{const p=ARM.pt(s.seg,s.t);
        if(s.ok){c.beginPath();c.arc(p[0],p[1],9,0,7);c.fillStyle=C.ok;c.fill();}
        else if(s.feel>.05){c.globalAlpha=s.feel;ring(c,p,16+s.feel*10,C.gold,true,3);c.globalAlpha=1;
          if(s.hold>0){c.beginPath();c.arc(p[0],p[1],30,-PI/2,-PI/2+2*PI*s.hold/1.1);c.strokeStyle=C.gold;c.lineWidth=6;c.stroke();}}});
      pops.forEach(q=>{const p=ARM.pt(q.s.seg,q.s.t);c.globalAlpha=Math.min(1,q.t);label(c,'拆開：'+q.s.type,clamp(p[0]-120,110,490),p[1]-34,C.ok,16);c.globalAlpha=1;});
      drawFingers(c);}};
}

const MAKERS=[gate1,gate2,gate3,gate4,gate5];
let G=null;
function gateDots(){[...$('gates').children].forEach((s,i)=>{s.className=i<S.g?'done':i===S.g?'now':'';});}
function showGate(){const g=GATES[S.g];gateDots();$('choices').hidden=true;$('gNum').textContent=`第 ${S.g+1} 關 / 5`;$('gTitle').textContent=g.k;$('gQuote').textContent='「'+g.q+'」';$('gHow').innerHTML=g.how;$('ovGate').hidden=false;}
function startGate(){$('ovGate').hidden=true;F.clear();G=MAKERS[S.g]();G.t=0;G.mA=0;G.mB=0;
  G.win=pts=>{if(!S.run)return;S.run=false;S.score+=pts+Math.max(0,Math.round((GATES[S.g].T-G.t)*3));S.passed++;S.stats.push(true);hint(GATES[S.g].k+' 過關！','var(--ok)');beep(880,.3);next();};
  G.hurt=msg=>{if(!S.run)return;S.hearts--;hint(msg,'var(--red)');beep(110,.35,'square',.1);if(S.hearts<=0){S.run=false;setTimeout(end,900);}};
  meters(0,0,G.lA,G.lB||' ');$('mB').style.visibility=G.lB?'visible':'hidden';S.run=true;}
function next(){if(S.g+1>=5){setTimeout(end,900);return;}S.g++;setTimeout(showGate,900);}
function timeUp(){S.run=false;S.hearts--;beep(110,.35,'square',.1);if(S.hearts<=0){hint('時間到，愛心用完了','var(--red)');setTimeout(end,800);return;}hint('時間到，這關沒過，重新來','var(--red)');setTimeout(()=>{showGate();$('gNum').textContent=`第 ${S.g+1} 關 / 5・重新挑戰`;},900);}

const TITLES=['還在調身','見習調整師','合格調整師','資深調整師','結構引導師','五關認證・結構大師'];
function end(){S.run=false;gateDots();$('choices').hidden=true;const t=TITLES[S.passed];$('endTitle').textContent=t;$('shareImg').src=card(t);$('ovEnd').hidden=false;}
function card(t){const k=document.createElement('canvas');k.width=1080;k.height=1350;const c=k.getContext('2d');
  c.fillStyle='#ece9e2';c.fillRect(0,0,1080,1350);c.textAlign='center';
  c.fillStyle=C.ink;c.font='900 100px "Noto Serif TC",serif';c.fillText('結構五關',540,170);
  ['合力','環鬆','串勁','收軸','拆解'].forEach((n,i)=>{const x=180+i*180,y=330,ok=S.stats[i];
    c.beginPath();c.arc(x,y,72,0,7);c.fillStyle=ok?C.ok:'#faf8f3';c.fill();c.lineWidth=4;c.strokeStyle=ok?C.ok:C.line;c.stroke();
    c.fillStyle=ok?'#fff':C.muted;c.font='bold 44px "Noto Serif TC",serif';c.fillText(n,x,y+15);});
  c.fillStyle=C.red;c.font='900 92px "Noto Serif TC",serif';c.fillText(t,540,560);
  c.fillStyle=C.ink;c.font='bold 60px sans-serif';c.fillText(`過關 ${S.passed} / 5｜${S.score} 分`,540,680);
  c.fillStyle=C.muted;c.font='40px "Noto Serif TC",serif';c.fillText('不是用力推拉，',540,840);c.fillText('是讓身體自己回到原本的平衡',540,900);
  c.fillStyle=C.ink;c.fillRect(0,1210,1080,140);c.fillStyle='#fff';c.font='bold 44px "Noto Serif TC",serif';c.fillText('站得穩，才走的久',540,1270);
  c.font='30px sans-serif';c.fillText('鈞衡舍 ChunBalance｜LINE @chunbalance',540,1320);return k.toDataURL('image/jpeg',.9);}

$('btnStart').onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}reset();$('ovStart').hidden=true;showGate();};
$('btnGo').onclick=startGate;
$('btnAgain').onclick=()=>{reset();$('ovEnd').hidden=true;showGate();};

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.run&&G){G.t+=dt;G.step(dt);if(S.run&&G.t>=GATES[S.g].T)timeUp();meters(G.mA,G.mB);}
  $('hearts').textContent='♥'.repeat(Math.max(0,S.hearts))+'♡'.repeat(3-Math.max(0,S.hearts));$('score').textContent=S.score;
  $('tleft').textContent=G&&S.run?Math.max(0,Math.ceil(GATES[S.g].T-G.t))+' 秒':'';
  const c=ctx;c.setTransform(view.dpr,0,0,view.dpr,0,0);c.clearRect(0,0,cv.width,cv.height);c.translate(view.ox,view.oy);c.scale(view.s,view.s);
  if(G)G.draw(c);else drawKArm(c);
  requestAnimationFrame(loop);}
fit();gateDots();requestAnimationFrame(loop);
if(document.fonts)document.fonts.ready.then(fit);
})();
</script>
