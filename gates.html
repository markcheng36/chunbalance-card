const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const norm=(v,suf)=>{v=(v||'').replace(/\s+/g,'').replace(/(老師|師父|師傅)$/,'');if(suf&&v&&!v.endsWith(suf))v+=suf;return v;};
async function open(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
try{localStorage.removeItem('chun-gates-pw')}catch(e){}
const Q=[['1. 我們的老師是誰？',''],['2. 我們是什麼門？','門'],['3. 未來要做什麼會？','會']],H=['30dd0372bc7006e0c905891c3f6a310bd73dcfc5f41a00089cc01e5443ef7835', '03f7b1af1ce94fe5fcc621dd012c95ff6d1319579d0d761ec78d1124c1284853', 'a44c3558a1c7be7876c34005c64218df0099cfd3f52f21470b0e535da8ce28e0'],SALT='7HNZaGFHwlM=';
let step=0;const ans=[],$=id=>document.getElementById(id);
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function ask(){$('q').textContent=Q[step][0];$('ans').value='';$('go').textContent=step<2?'下一題':'開始';
 [...$('dots').children].forEach((d,i)=>d.className=i<step?'on':i===step?'cur':'');$('ans').focus();}
function bad(t){const m=$('msg');m.textContent=t;const b=$('box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
$('f').onsubmit=async e=>{e.preventDefault();const v=norm($('ans').value,Q[step][1]);
 if(!v){bad('請先作答');return;}
 if(await sha(SALT+v)!==H[step]){bad('答案不對，再想想看');return;}
 ans[step]=v;$('msg').textContent='';
 if(step<2){step++;ask();return;}
 $('msg').textContent='確認中…';$('go').disabled=true;
 try{show(await open(ans.join('|')));}catch(err){$('go').disabled=false;step=0;ask();bad('出了點問題，請重新作答');}};
ask();
})();
