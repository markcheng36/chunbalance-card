<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<style>
  :root{
    --olive:#6B7355;
    --olive-dark:#4F5740;
    --brown:#8B7355;
    --brown-light:#A89078;
    --coral:#C1553D;
    --cream:#F3F2EE;
    --ink:#3A362F;
    --ink-soft:#6B6558;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:var(--olive-dark);
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .card{
    flex:0 0 100%;
    scroll-snap-align:start;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:64px 34px 90px;
    text-align:center;
    position:relative;
  }
  .content-scale{
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---- shared heading ---- */
  .eyebrow{
    font-size:15px;letter-spacing:4px;color:var(--brown);font-weight:700;margin-bottom:12px;
  }
  .heading{
    font-size:33px;font-weight:700;letter-spacing:3px;color:var(--ink);margin-bottom:28px;
  }

  /* ---- card 4 charity ---- */
  .card4{background:#EDEAE0;}
  .charity-org{font-size:19px;font-weight:700;color:var(--coral);letter-spacing:1px;line-height:1.7;margin-bottom:20px;}
  .charity-desc{
    font-size:17.5px;color:var(--ink);line-height:1.85;letter-spacing:0.5px;
    max-width:320px;margin-bottom:30px;
  }
  .btn{
    display:inline-block;box-sizing:border-box;
    background:var(--olive);color:#fff;border:none;appearance:none;-webkit-appearance:none;
    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:2px;line-height:1.3;
    text-align:center;vertical-align:middle;
    padding:13px 26px;border-radius:999px;text-decoration:none;
    box-shadow:0 6px 16px rgba(107,115,85,0.35);
    cursor:pointer;
  }
  .btn-coral{
    background:var(--coral);
    box-shadow:0 6px 16px rgba(193,85,61,0.35);
  }
  html,body{background:#EDEAE0;height:auto;}
  .card4{width:430px;height:auto;flex:none;}
</style></head><body>
<section class="card card4"><div class="content-scale">
<div class="eyebrow">CHARITY</div>
<div class="heading">公益活動</div>
<div class="charity-org">中華武醫國際交流發展總會<br>北部分會 執行長</div>
<div class="charity-desc">
  長期投入「武醫義整」公益活動，提供無償足部健檢與結構調整服務，
  秉持「心法勝過招式」的理念，先幫助想幫助別人的人恢復健康。
</div>
</div></section>
</body></html>
