<script>

  var SERVICE = [
    ['馬克主要提供的服務是？', ['身體結構調整', '美甲美睫', '中醫開藥'], '身體結構平衡教練，從結構、肌肉到身心，找到原因再處理。'],

    ['馬克調整的流程是？', ['聽懂 → 找原因 → 處理 → 維護', '先按再說，按到不痛為止', '每次都做一樣的動作'], '先聽懂、找原因、處理，最後一起維護。'],
    ['馬克調整的第一步是？', ['先聽懂你哪裡不舒服', '直接喬骨頭', '先用力按痛點'], '先聽懂你哪裡不舒服、生活怎麼過。'],
    ['馬克常說：「痛的地方，___」', ['不一定是痛的原因', '按下去就好了', '熱敷就會好'], '痛的地方，不一定是痛的原因。'],
    ['足部拓印圖對馬克來說是什麼？', ['身體傳達給我們的訊息', '一張診斷書', '算命用的腳相'], '先聽你的主訴、痛點，了解你的習慣和姿勢，最後一起來看看身體想告訴我們什麼。'],
    ['調整完，馬克常說：「調整我來，___」', ['維持交給你', '剩下交給命', '痛就忍著'], '身體回到平衡這條路需要我們一起努力，調整我來，但維持需要你。'],
    ['維護的時候，馬克會請你做什麼？', ['穿對鞋、改習慣、練起來', '什麼都不用做', '每天都來報到'], '穿對鞋、改習慣、練起來。'],
    ['馬克調整的方式是固定的嗎？', ['不是，以心法因人而異', '是，每個人都一樣', '看當天心情'], '以心法而非固定手法，因人而異找到最適合你的調整方式。'],
    ['什麼樣的人最適合找馬克調整？', ['常覺得站不久、身體緊痠痛麻的人', '只想一次見效的人', '只比價格的人'], '願意花時間調整改善的人，最適合找我。']
  ];
  var PERSON = [
    ['馬克的品牌叫什麼？', ['鈞衡舍', '均衡館', '平衡屋'], '鈞衡舍 ChunBalance，是我創立的品牌。'],
    ['「身體平衡找馬克」下一句是？', ['站得穩才走的久', '睡得飽才笑的久', '吃得對才活的久'], '身體平衡找馬克，站得穩才走的久。'],
    ['馬克轉行前，在哪一行做了 10 年？', ['資訊業', '銀行業', '餐飲業'], '從系統分析師做到專案、產品經理。從解決系統的問題，變成解決人的問題。'],
    ['馬克是哪一門的第五代傳人？', ['董氏針灸', '太極拳', '少林武術'], '董氏針灸第五代傳人，透過穴位保養自己，也分享觀念。'],
    ['馬克考過哪一個國家級資格？', ['健美裁判', '游泳教練', '咖啡師'], '國家級健美裁判，也是健身教練。'],
    ['馬克在做公益的身分是？', ['武醫北部分會執行長', '社區里長', '基金會董事'], '透過公益方式幫助需要幫助的人，分享大健康理念。'],
    ['馬克現在駐點在哪裡？', ['結構X獵人', '連鎖健身房', '醫院復健科'], '駐點在結構X獵人。'],
    ['馬克為什麼去學運動按摩？', ['學生常請假去按摩', '想開按摩店', '家裡要他學'], '當教練時學生常請假去按摩，所以我進修了運動按摩。'],
    ['小時候，每學期開學第一天，馬克會？', ['緊張到拉肚子回家', '第一個衝進教室', '被選為班長'], '國小每學期開學第一天，都會緊張到拉肚子、頭痛，然後就回家了。'],
    ['大學時，馬克在哪裡打工？', ['爭鮮當壽司師傅', '手搖飲店', '便利商店大夜班'], '在爭鮮打工當壽司師傅，也當數學家教。'],
    ['大學金融實習，馬克的成績是？', ['第 2 名', '最後一名', '沒做完就跑了'], '以第 2 名完成實習，但也更確認……我真的無法。'],
    ['馬克在資訊業考了人資證照，之後變得很會？', ['面試', '算薪水', '做簡報'], '之後變得非常會面試，有面試機會幾乎等於錄取。'],
    ['馬克是 i 人還是 e 人？', ['i 人', 'e 人', '看心情'], '雖然是個 i 人，但卻以 e 人的方式享受世界。'],
    ['這麼 i 的馬克，現在還成為了？', ['超共感的能量療癒師', '網紅直播主', '脫口秀演員'], '如此 i 的人，現在卻成為超共感的「能量療癒師」。'],
    ['馬克在能量這一塊學了什麼？', ['靈氣、生物能頭薦骨', '塔羅牌', '風水'], '發覺身體跟心靈一樣重要，進修了靈氣、生物能頭薦骨。'],
    ['馬克做事的出發點是？', ['好玩', '面子', '壓力'], '凡事以好玩為出發，才能做得好、走的久。'],
    ['馬克幫哪一種選手做過賽前結構調整？', ['IFBB PRO 健美職業選手', '職業棒球員', '電競選手'], '幫 IFBB PRO 健美職業選手做賽前結構調整，改善代償問題。'],
    ['除了重訓，馬克還喜歡？', ['藝文展覽', '打電動', '釣魚'], '運動訓練、藝文展覽都是我的興趣。'],
    ['馬克在新北市哪一區？', ['板橋', '淡水', '新店'], '新北市板橋區。']
  ];
  var GOAL = [
    ['馬克想讓鈞衡舍成為哪一群人身體平衡的第一品牌？', ['上班族／久坐族', '小學生', '專業運動員'], '成為上班族／久坐族在身體平衡的第一品牌。'],
    ['馬克 2028 年想做什麼？', ['開自己的身體平衡工作室', '退休環遊世界', '回資訊業上班'], '2028 年開自己的身體平衡工作室，讓鈞衡舍變成招牌事業。'],
    ['馬克想推廣的大健康教育是：「___是健康根基」', ['足部', '頭部', '心臟'], '一起推廣「足部是健康根基」的大健康教育。']
  ];
  var QS = [];
  var i = 0, right = 0, marks = [], order = [];
  var $ = function(id){ return document.getElementById(id); };
  function shuffle(a){ a = a.slice(); for (var k = a.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
  function show(id){ ['start', 'play', 'end'].forEach(function(s){ $(s).hidden = s !== id; }); window.scrollTo(0, 0); }

  function bar(){
    var h = '';
    for (var k = 0; k < QS.length; k++) h += '<span class="' + (k < i ? marks[k] : (k === i ? 'now' : '')) + '"></span>';
    $('bar').innerHTML = h;
  }
  function ask(){
    var item = QS[i];
    order = shuffle([0, 1, 2]);
    bar();
    $('qn').textContent = '第 ' + (i + 1) + ' 題 / ' + QS.length;
    $('q').textContent = item[0];
    $('opts').innerHTML = order.map(function(o, k){
      return '<button class="opt" type="button" data-o="' + o + '"><em>' + 'ABC'[k] + '</em><span>' + item[1][o] + '</span></button>';
    }).join('');
    $('tip').hidden = true; $('nextBox').hidden = true;
  }
  $('opts').addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if (!b || b.disabled) return;
    var ok = b.getAttribute('data-o') === '0';
    Array.prototype.forEach.call($('opts').children, function(x){
      x.disabled = true;
      if (x.getAttribute('data-o') === '0') x.classList.add('right');
    });
    if (!ok) b.classList.add('wrong');
    if (ok) right++;
    marks[i] = ok ? 'done' : 'miss';
    $('tip').className = 'tip' + (ok ? ' good' : '');
    $('tip').innerHTML = '<b>' + (ok ? '答對了！' : '答案是「' + QS[i][1][0] + '」') + '</b>' + QS[i][2];
    $('tip').hidden = false;
    $('next').textContent = i === QS.length - 1 ? '看結果' : '下一題';
    $('nextBox').hidden = false;
  });
  $('next').addEventListener('click', function(){ i++; if (i < QS.length) { ask(); window.scrollTo(0, 0); } else finish(); });

  function finish(){
    // 三個等級（6 題）：5–6 招待券、3–4 邀請卡、0–2 見面禮
    var tier = right >= 5 ? {v: 'high', c: ' reward', t: '你真的懂我！', n: '身體平衡招待券', g: '免費體驗券', p: '謝謝你這麼認識我，這張是給你的獎勵。', m: '認識我這麼多，<b>換我來認識你的身體</b>。'}
      : right >= 3 ? {v: 'mid', c: ' mid', t: '我們有點熟了', n: '身體平衡邀請卡', g: '免費體驗券', p: '你認識我一半了，剩下的一半，來體驗一次就知道。', m: '差一點點，<b>來體驗一次，我們會更熟</b>。'}
      : {v: 'low', c: '', t: '我們還不太熟', n: '身體平衡見面禮', g: '免費體驗券＋足部張力檢測', p: '你太不認識我了，所以我要給你一個機會，好好認識我。', m: '沒關係，<b>來體驗一次，你就認識我了</b>。'};
    $('score').innerHTML = right + '<small> / ' + QS.length + '</small>';
    $('vImg').src = 'assets/quiz-voucher-' + tier.v + '.png';
    $('vImg').alt = tier.n + '：' + tier.g;
    VNAME = tier.n;
    $('endTitle').textContent = tier.t;
    $('endMsg').innerHTML = tier.m;
    show('end');
  }
  // 存券：手機能分享檔案就直接存或傳；不能的話提示長按圖片
  var VNAME = '';
  $('save').addEventListener('click', function(){
    var img = $('vImg'), tip = $('saveTip');
    var hint = function(){ tip.innerHTML = '<b>長按上面的圖片</b>，選「儲存圖片」就存下來了'; img.scrollIntoView({behavior: 'smooth', block: 'center'}); };
    fetch(img.src).then(function(r){ return r.blob(); }).then(function(b){
      var f = new File([b], VNAME + '.png', {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [f]})) return navigator.share({files: [f], title: VNAME}).catch(function(){});
      hint();
    }).catch(hint);
  });
  function start(){ QS = shuffle(shuffle(SERVICE).slice(0, 2).concat(shuffle(PERSON).slice(0, 2), shuffle(GOAL).slice(0, 2))); i = 0; right = 0; marks = []; show('play'); ask(); }
  $('go').addEventListener('click', start);
  $('again').addEventListener('click', function(){ show('start'); });
  $('share').addEventListener('click', function(){
    var url = 'https://chunbalance.com/quiz.html', b = this;
    var done = function(){ b.textContent = '連結已複製'; };
    if (navigator.share) navigator.share({title: '你有多認識馬克？', url: url}).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function(){ b.textContent = url; });
    else b.textContent = url;
  });
</script>
</body>
