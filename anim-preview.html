<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>鈞衡舍｜名片動畫預覽</title>
<style>
body{margin:0;background:#8c9fb7;font-family:sans-serif;color:#222}
h1{font-size:16px;margin:16px;color:#fff}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 20px;scroll-snap-type:x mandatory}
.card{flex:0 0 78%;max-width:320px;background:#fff;border-radius:14px;overflow:hidden;scroll-snap-align:center}
.card img{display:block;width:100%;aspect-ratio:1/1}
.card p{margin:8px 10px 12px;font-size:13px;color:#555}
</style>
</head>
<body>
<h1>BNI 版（左右滑）</h1>
<div class="row">
<div class="card"><img src="assets/card0_bni_sq_anim_v2.png" alt=""><p>獨門絕活綠條：一道光滑過</p></div>
<div class="card"><img src="assets/card1_opening_sq_anim_v2.png" alt=""><p>Logo：金色光滑過</p></div>
<div class="card"><img src="assets/card2_services_sq_anim_v2.png" alt=""><p>服務項目：五項依序金色光滑過</p></div>
<div class="card"><img src="assets/card4_location_sq_anim_v2.png" alt=""><p>地點：圖釘輕跳</p></div>
<div class="card"><img src="assets/card5_charity_sq_anim_v2.png" alt=""><p>公益：金色光滑過協會名</p></div>
<div class="card"><img src="assets/card6_contact_sq_anim_v2.png" alt=""><p>聯絡：金色光滑過電話</p></div>
</div>
</body>
</html>
