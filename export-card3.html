<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<style>
  :root{
    --olive:#6B7355;
    --olive-dark:#4F5740;
    --brown:#8B7355;
    --brown-light:#A89078;
    --coral:#C1553D;
    --cream:#F3F2EE;
    --ink:#3A362F;
    --ink-soft:#6B6558;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:var(--olive-dark);
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  .card{
    flex:0 0 100%;
    scroll-snap-align:start;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:64px 34px 90px;
    text-align:center;
    position:relative;
  }
  .content-scale{
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---- shared heading ---- */
  .eyebrow{
    font-size:15px;letter-spacing:4px;color:var(--brown);font-weight:700;margin-bottom:12px;
  }
  .heading{
    font-size:33px;font-weight:700;letter-spacing:3px;color:var(--ink);margin-bottom:28px;
  }

  /* ---- card 3 location ---- */
  .card3{background:var(--cream);}
  .venue-logo{width:150px;height:auto;margin-bottom:22px;}
  .pin{font-size:40px;margin-bottom:16px;}
  .place-name{font-size:29px;font-weight:700;color:var(--olive-dark);letter-spacing:1px;line-height:1.6;margin-bottom:26px;}

  .btn{
    display:inline-block;box-sizing:border-box;
    background:var(--olive);color:#fff;border:none;appearance:none;-webkit-appearance:none;
    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:2px;line-height:1.3;
    text-align:center;vertical-align:middle;
    padding:13px 26px;border-radius:999px;text-decoration:none;
    box-shadow:0 6px 16px rgba(107,115,85,0.35);
    cursor:pointer;
  }
  html,body{background:#F3F2EE;height:auto;}
  .card3{width:430px;height:auto;flex:none;}
</style></head><body>
<section class="card card3"><div class="content-scale">
<div class="eyebrow">LOCATION</div>
<div class="heading">駐點位置</div>
<img class="venue-logo" src="images/venue-logo.png" alt="">
<div class="pin">📍</div>
<div class="place-name">板橋江子翠捷運站</div>
</div></section>
</body></html>
