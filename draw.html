<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>券號抽獎</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --line: #e2ddd3; --accent: #2f6b4f; --accent-soft: #e6f0ea; --hot: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161816; --card: #212421; --text: #ececec; --muted: #a0a0a0;
            --line: #353a35; --accent: #7cc39d; --accent-soft: #24382c; --hot: #ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         font-size: 16px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  input, button { font: inherit; color: var(--text); }
  input { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=number] { width: 90px; text-align: right; }
  input.wide { width: 100%; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .row label { min-width: 72px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px;
           padding: 10px 16px; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.danger { background: var(--hot); }
  button:disabled { opacity: .45; cursor: default; }
  .stage { text-align: center; background: var(--accent-soft); border-color: var(--accent); padding: 24px 16px; }
  .prize { font-size: 22px; font-weight: 700; color: var(--accent); min-height: 33px; }
  .num { font-size: min(30vw, 200px); font-weight: 800; letter-spacing: 2px; line-height: 1.1;
         font-variant-numeric: tabular-nums; margin: 8px 0; }
  .num.win { color: var(--hot); animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .go { font-size: 22px; padding: 14px 40px; }
  .left { margin-top: 8px; }
  ol { margin: 0; padding-left: 22px; }
  li { margin: 2px 0; }
  li b { font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-weight: 600; }
  body.show .setup { display: none; }
</style>
</head>
<body>
<main>
  <h1>券號抽獎</h1>

  <div class="card stage">
    <div class="prize" id="prizeLabel"></div>
    <div class="num" id="num">----</div>
    <button class="go" id="goBtn">抽一個</button>
    <div class="muted left" id="leftInfo"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>中獎名單</b>
      <button class="secondary" id="undoBtn">取消上一個</button>
    </div>
    <ol id="winners"></ol>
    <div class="muted" id="noWin">還沒抽。</div>
  </div>

  <div class="card setup">
    <details id="setupBox" open>
      <summary>設定（抽之前先填好）</summary>
      <div class="row"><label>券號從</label><input type="number" id="from" min="1" value="1">
        <span>到</span><input type="number" id="to" min="1" value="30"></div>
      <div class="row"><label>不抽這些</label>
        <input class="wide" id="skip" placeholder="沒發出去的號碼，例如 5, 12, 20-25"></div>
      <div class="row"><label>獎項</label>
        <input class="wide" id="prizes" placeholder="一行一個也可以用逗號隔開，例如 足弓墊, 免費調整一次"></div>
      <p class="muted">獎項會照順序一個一個抽，抽完後再按會繼續抽「加碼」。設定會記在這台手機上，重新整理也不會不見。同一個號碼不會被抽到兩次。</p>
      <div class="row">
        <button class="secondary" id="hideBtn">投影模式（藏起設定）</button>
        <button class="danger" id="resetBtn">清空中獎名單</button>
      </div>
    </details>
  </div>
  <p class="muted" style="text-align:center"><a href="#" id="showSetup" hidden>顯示設定</a></p>
</main>

<script>
const KEY = 'chun-draw-v1';
const $ = id => document.getElementById(id);
let state = { from: 1, to: 30, skip: '', prizes: '', winners: [] };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const pad = n => String(n).padStart(Math.max(4, String(state.to).length), '0');

function parseSkip(text) {
  const set = new Set();
  String(text).replace(/[，、]/g, ',').split(/[,\s]+/).forEach(p => {
    const m = p.match(/^(\d+)(?:[-~－～](\d+))?$/);
    if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) set.add(i);
  });
  return set;
}
function prizeList() {
  return String(state.prizes).split(/[\n,，、]+/).map(s => s.trim()).filter(Boolean);
}
function pool() {
  const skip = parseSkip(state.skip);
  const won = new Set(state.winners.map(w => w.n));
  const out = [];
  for (let i = +state.from; i <= +state.to; i++) if (!skip.has(i) && !won.has(i)) out.push(i);
  return out;
}
function nextPrize() {
  const list = prizeList();
  const i = state.winners.length;
  if (!list.length) return '第 ' + (i + 1) + ' 位';
  return i < list.length ? list[i] : '加碼';
}
function randInt(n) {
  const a = new Uint32Array(1);
  const lim = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}

function render() {
  $('from').value = state.from; $('to').value = state.to;
  $('skip').value = state.skip; $('prizes').value = state.prizes;
  const p = pool();
  $('prizeLabel').textContent = p.length ? '這次抽：' + nextPrize() : '';
  $('leftInfo').textContent = '還有 ' + p.length + ' 個號碼可以抽';
  $('goBtn').disabled = !p.length || rolling;
  $('winners').innerHTML = state.winners.map(w =>
    '<li><b>No.' + pad(w.n) + '</b>　' + w.prize.replace(/[<>&]/g, '') + '</li>').join('');
  $('noWin').hidden = state.winners.length > 0;
  $('undoBtn').hidden = !state.winners.length;
}

let rolling = false;
$('goBtn').onclick = () => {
  const p = pool();
  if (!p.length || rolling) return;
  rolling = true; render();
  const el = $('num'); el.classList.remove('win');
  const pick = p[randInt(p.length)];
  const prize = nextPrize();
  let t = 0, delay = 40;
  (function spin() {
    el.textContent = pad(p[randInt(p.length)]);
    t += delay;
    if (t < 2600) { delay = t > 1600 ? delay * 1.18 : delay; setTimeout(spin, delay); return; }
    el.textContent = pad(pick);
    void el.offsetWidth; el.classList.add('win');
    state.winners.push({ n: pick, prize });
    save(); rolling = false; render();
  })();
};

['from', 'to', 'skip', 'prizes'].forEach(id => $(id).addEventListener('input', () => {
  state[id] = (id === 'from' || id === 'to') ? (+$(id).value || 1) : $(id).value;
  save(); render();
}));

// Two-tap buttons: confirm() is not reliable everywhere, so the first tap arms, the second does it.
function twoTap(btn, label, action) {
  let armed = null;
  btn.onclick = () => {
    if (armed) { clearTimeout(armed); armed = null; btn.textContent = label; action(); return; }
    btn.textContent = '再按一次確定';
    armed = setTimeout(() => { armed = null; btn.textContent = label; }, 3000);
  };
}
twoTap($('resetBtn'), '清空中獎名單', () => { state.winners = []; $('num').textContent = '----';
  $('num').classList.remove('win'); save(); render(); });
twoTap($('undoBtn'), '取消上一個', () => { state.winners.pop(); save(); render(); });

$('hideBtn').onclick = () => { document.body.classList.add('show'); $('showSetup').hidden = false; };
$('showSetup').onclick = e => { e.preventDefault(); document.body.classList.remove('show'); $('showSetup').hidden = true; };

render();
</script>
</body>
</html>
